<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Lab network: Wazuh, Windows and Kali on the isolated SOCLab network 10.10.10.0/24, each also on NAT for internet">
  <rect width="720" height="300" fill="#ffffff"/>
  <style>
    text { font-family: system-ui, Segoe UI, Arial, sans-serif; font-size: 13px; fill: #12222a; }
    .sub { font-size: 11.5px; fill: #4f636d; }
    .box { fill: #ffffff; stroke: #12222a; stroke-width: 1.4; }
    .hot { fill: #dcedf2; stroke: #0b6e8a; stroke-width: 1.6; }
    .bus { stroke: #0b6e8a; stroke-width: 3; }
    .wire { stroke: #4f636d; stroke-width: 1.4; fill: none; }
    .dash { stroke: #4f636d; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
  </style>
  <line class="bus" x1="40" y1="130" x2="680" y2="130"/>
  <text x="360" y="152" text-anchor="middle" class="sub">NAT Network "SOCLab" - 10.10.10.0/24 - isolated lab traffic</text>

  <line class="wire" x1="125" y1="80" x2="125" y2="130"/>
  <rect class="hot" x="40" y="20" width="170" height="60" rx="8"/>
  <text x="125" y="45" text-anchor="middle" font-weight="600">Ubuntu 22.04 Desktop</text>
  <text x="125" y="63" text-anchor="middle" class="sub">Wazuh 4.14.9 (SIEM)</text>

  <line class="wire" x1="360" y1="80" x2="360" y2="130"/>
  <rect class="box" x="275" y="20" width="170" height="60" rx="8"/>
  <text x="360" y="45" text-anchor="middle" font-weight="600">Windows</text>
  <text x="360" y="63" text-anchor="middle" class="sub">Sysmon + Wazuh agent</text>

  <line class="wire" x1="595" y1="80" x2="595" y2="130"/>
  <rect class="box" x="510" y="20" width="170" height="60" rx="8"/>
  <text x="595" y="45" text-anchor="middle" font-weight="600">Kali Linux</text>
  <text x="595" y="63" text-anchor="middle" class="sub">Third lab machine</text>

  <rect x="40" y="190" width="640" height="70" rx="8" class="dash"/>
  <text x="360" y="215" text-anchor="middle">Host: Windows 11 + Oracle VirtualBox</text>
  <text x="360" y="235" text-anchor="middle" class="sub">Adapter 1 = NAT (internet via home Wi-Fi) - Adapter 2 = SOCLab (lab only)</text>
</svg>
